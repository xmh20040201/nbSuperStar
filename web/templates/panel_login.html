<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperStar 面板登录</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    .card {
      width: 360px; padding: 32px; border-radius: 16px; background: #1e293b;
      box-shadow: 0 20px 50px rgba(0,0,0,.45); border: 1px solid #334155;
    }
    h1 { margin: 0 0 6px; font-size: 20px; }
    p.sub { margin: 0 0 24px; font-size: 13px; color: #94a3b8; }
    label { display: block; font-size: 13px; margin-bottom: 8px; color: #cbd5e1; }
    input[type=password] {
      width: 100%; padding: 11px 13px; border-radius: 9px; border: 1px solid #475569;
      background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none;
    }
    input[type=password]:focus { border-color: #38bdf8; }
    button {
      width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 9px;
      background: #38bdf8; color: #0f172a; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .msg { margin-top: 14px; font-size: 13px; color: #f87171; min-height: 18px; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <h1>SuperStar 面板</h1>
    <p class="sub">请输入访问密码</p>
    <label for="pw">访问密码</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus />
    <button type="submit" id="btn">登录</button>
    <div class="msg" id="msg"></div>
  </form>

  <script>
    const form = document.getElementById('form');
    const pw = document.getElementById('pw');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      btn.disabled = true;
      try {
        const res = await fetch('/api/panel/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw.value })
        });
        const data = await res.json();
        if (res.ok && data.status === 'ok') {
          const params = new URLSearchParams(location.search);
          const next = params.get('next') || '/';
          location.href = (next.startsWith('/') && !next.startsWith('//')) ? next : '/';
        } else {
          msg.textContent = data.msg || '登录失败';
          pw.select();
        }
      } catch (err) {
        msg.textContent = '网络错误: ' + err;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>

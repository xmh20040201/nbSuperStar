<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperStar 管理面板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <span class="fs-5 fw-bold">&#9733; SuperStar</span>
                <span class="badge bg-secondary ms-2 fs-6 fw-normal">Web Panel</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="#" data-view="config">&#9881; 配置</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-view="auth">&#128274; 登录</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-view="courses">&#128218; 课程</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-view="study">&#9654; 刷课</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-view="logs">&#128214; 日志</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-view="tiku">&#128220; 题库</a></li>
                </ul>
                <span class="navbar-text" id="loginStatusBadge">
                    <span class="badge bg-danger">未登录</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <div class="row">
            <div class="col-md-2 d-none d-md-block">
                <div class="list-group" id="sidebarNav">
                    <a href="#" class="list-group-item list-group-item-action" data-view="config">&#9881; 配置</a>
                    <a href="#" class="list-group-item list-group-item-action" data-view="auth">&#128274; 登录</a>
                    <a href="#" class="list-group-item list-group-item-action" data-view="courses">&#128218; 课程</a>
                    <a href="#" class="list-group-item list-group-item-action" data-view="study">&#9654; 刷课</a>
                    <a href="#" class="list-group-item list-group-item-action" data-view="logs">&#128214; 日志</a>
                    <a href="#" class="list-group-item list-group-item-action" data-view="tiku">&#128220; 题库</a>
                </div>
                <hr>
                <div class="small text-muted px-2" id="sidebarStatus">
                    <div>状态: <span id="statusIndicator" class="text-secondary">空闲</span></div>
                    <div>进度: <span id="sidebarProgress">-</span></div>
                </div>
            </div>
            <div class="col-md-10" id="mainContent">
                <div class="text-center text-muted py-5">
                    <h4>&#9733; SuperStar 学习管理面板</h4>
                    <p>请从左侧导航选择功能</p>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
